<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ustozbek</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%2296%22%20fill%3D%22%2312212b%22/%3E%3Cpath%20d%3D%22M168%20136V280a88%2088%200%200%200%2088%2088%22%20fill%3D%22none%22%20stroke%3D%22%234fd1a5%22%20stroke-width%3D%2248%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M344%20136V280a88%2088%200%200%201-88%2088%22%20fill%3D%22none%22%20stroke%3D%22%23ff9a6b%22%20stroke-width%3D%2248%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%22256%22%20cy%3D%22150%22%20r%3D%2222%22%20fill%3D%22%23f2b632%22/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12212b">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: hash-routed site. Home -> division -> audience hub (tile grid of sections) -> section page. */
:root{
  --bg:#f1f4f3;
  --surface:#ffffff;
  --fg:#12212b;
  --muted:#52646e;
  --line:#d3dcda;
  --ict:#0b7a5c;
  --math:#b8431a;
  --accent-ink:#ffffff;
  --mark:#f2b632;
  --bad:#c4473a;
  --accent:var(--ict);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1819;--surface:#152325;--fg:#e6efec;--muted:#9fb2ae;--line:#274044;
  --ict:#4fd1a5;--math:#ff9a6b;--accent-ink:#0c1a17;--bad:#ff8a7d;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1819;--surface:#152325;--fg:#e6efec;--muted:#9fb2ae;--line:#274044;
  --ict:#4fd1a5;--math:#ff9a6b;--accent-ink:#0c1a17;--bad:#ff8a7d;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.wrap{max-width:1080px;margin:0 auto}
a{color:inherit}
button{font-family:inherit}
code{font-family:var(--f-mono);font-size:.9em;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
[data-div="ict"]{--accent:var(--ict)}
[data-div="math"]{--accent:var(--math)}

header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:19;background:var(--bg);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.logo{font:800 22px/1 var(--f-display);letter-spacing:-.02em;text-decoration:none;white-space:nowrap}
.logo{display:flex;align-items:center;gap:10px}
.logo b{font-weight:800}
.logo .mark{width:30px;height:30px;flex:none}
.logo span{color:var(--ict)}
.nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0;min-width:0;overflow-x:auto}
.nav a.l{display:block;padding:8px 12px;border-radius:8px;text-decoration:none;font:500 14px/1 var(--f-mono);color:var(--muted);white-space:nowrap}
.nav a.l:hover{background:var(--surface);color:var(--fg)}
.nav a.l.on{background:var(--surface);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}

.eyebrow{font:500 13px/1 var(--f-mono);color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin:0 0 14px}
h1{font:800 clamp(38px,7vw,64px)/1.03 var(--f-display);letter-spacing:-.03em;margin:0 0 18px;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--mark) 62% 92%,transparent 92%)}
h2{font:800 clamp(26px,4.2vw,36px)/1.1 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h3{font:600 20px/1.2 var(--f-display);margin:0}
.lead{font-size:18px;color:var(--muted);max-width:52ch;margin:0}
.sub{color:var(--muted);margin:0;max-width:60ch}
.head{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
section{padding-block:32px}
.page{padding-block:36px 48px}
.crumbs{font:400 13px/1.5 var(--f-mono);color:var(--muted);margin:0 0 24px;display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--fg)}

.btn{display:inline-block;padding:13px 20px;border-radius:10px;font:600 15px/1 var(--f-body);text-decoration:none;border:2px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:10px 14px;font-size:14px}
.btn:hover{transform:translateY(-1px)}
.row{display:flex;flex-wrap:wrap;gap:12px}

.divs{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding-bottom:24px}
.divs>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:14px}
.panel .big{font:800 clamp(34px,6vw,48px)/1 var(--f-display);letter-spacing:-.03em;color:var(--accent)}
.panel p{margin:0;color:var(--muted)}
.panel .row{margin-top:auto;padding-top:8px}
.hero{padding-block:48px 36px;display:grid;gap:18px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.two>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px;min-width:0;text-decoration:none}
a.card:hover{border-color:var(--accent)}
.card .path{font:500 13px/1 var(--f-mono);color:var(--accent)}
.card p{margin:0;color:var(--muted);font-size:15px}
.card ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px}

/* Hub: outer card + tiles, like a section index */
.hub{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px}
.hub-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.hub-h .big{font:800 clamp(34px,7vw,52px)/1 var(--f-display);letter-spacing:-.03em;color:var(--accent)}
.pill{font:500 13px/1 var(--f-mono);padding:8px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:16px;background:var(--bg);border:1px solid transparent;text-decoration:none;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile svg{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile b{font:600 18px/1.25 var(--f-display)}
.tile span.d{font-size:14px;color:var(--muted);line-height:1.4}
.tile .soon-t{align-self:flex-start;font:400 11px/1 var(--f-mono);padding:4px 7px;border-radius:5px;border:1px dashed var(--line);color:var(--muted)}
@media (max-width:520px){.tiles{grid-template-columns:1fr 1fr}.tile{padding:14px}.hub{padding:16px}}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:48px;height:48px;padding:0 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:800 18px/1 var(--f-display);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lbl{font:500 12px/1 var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px}

.topics{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.topics li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;font-weight:500}
.tag{align-self:flex-start;font:400 12px/1 var(--f-mono);padding:5px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.note{font:400 12px/1.5 var(--f-mono);color:var(--muted);margin:16px 0 0}

.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:640px}
.qt{font:600 20px/1.35 var(--f-display);margin:0 0 16px}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);font:500 15px/1.3 var(--f-body);cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.ok{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.opt.no{border-color:var(--bad);color:var(--bad)}
.fb{min-height:24px;margin:14px 0 0;font-size:14px;color:var(--muted)}
.big-score{font:800 56px/1 var(--f-display);color:var(--accent);margin:8px 0 14px}

.game{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:640px;display:flex;flex-direction:column;gap:14px}
.game .stat{display:flex;gap:18px;font:500 14px/1 var(--f-mono);color:var(--muted);flex-wrap:wrap}
.game .stat b{color:var(--fg);font-weight:500}
.target{font:800 clamp(48px,12vw,72px)/1 var(--f-display);color:var(--accent);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bits{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.bit{display:flex;flex-direction:column;align-items:center;gap:4px;font:400 11px/1 var(--f-mono);color:var(--muted)}
.bit button{width:100%;aspect-ratio:1;max-height:56px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);font:800 20px/1 var(--f-display);cursor:pointer}
.bit button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mq{font:800 clamp(36px,9vw,56px)/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.inp{font:600 24px/1 var(--f-mono);width:100%;max-width:220px;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.bar{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}

.tool{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.sel{display:grid;grid-template-columns:140px 1fr;gap:12px}
.sel>*{min-width:0}
select{font:500 15px/1.3 var(--f-body);padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
pre.plan{margin:0;padding:16px;background:var(--bg);border:1px solid var(--line);border-radius:10px;font:400 13px/1.7 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere}
pre.code{margin:10px 0 0;padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;font:400 13px/1.6 var(--f-mono);overflow-x:auto;color:var(--fg)}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details+details{margin-top:10px}
summary{cursor:pointer;padding:14px 16px;font:600 17px/1.3 var(--f-display);list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent);font-family:var(--f-mono)}
details[open] summary::after{content:"−"}
details>div{padding:0 16px 16px;color:var(--muted);font-size:15px}
details>div p{margin:0 0 8px}
details>div ul,details>div ol{margin:0;padding-left:20px;display:grid;gap:4px}
details>div b{color:var(--fg);font-weight:600}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;font-size:15px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.checks{display:grid;gap:8px}
.soon{display:flex;flex-wrap:wrap;gap:8px}
.soon span{font:400 13px/1 var(--f-mono);padding:8px 10px;border:1px dashed var(--line);border-radius:8px;color:var(--muted)}


.tl{all:unset;cursor:pointer;font-weight:600;color:var(--fg);line-height:1.35;display:block}
.tl:hover{color:var(--accent)}
.tl:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.tag.ok{color:var(--accent);border-color:var(--accent)}
.lesson{margin-top:20px;max-width:68ch}
.lesson h3.lt{font:800 clamp(24px,4vw,32px)/1.15 var(--f-display);margin:0 0 14px;letter-spacing:-.02em}
.lesson h4{font:600 19px/1.25 var(--f-display);margin:24px 0 8px}
.lesson p{margin:0 0 12px}
.lesson ul,.lesson ol{margin:0 0 12px;padding-left:22px;display:grid;gap:4px}
.lesson .ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.lesson .ex b{color:var(--accent)}
.lesson .tw{overflow-x:auto;margin-bottom:14px}
.lesson table{border-collapse:collapse;width:100%;font-size:15px}
.lesson th,.lesson td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.lesson th{background:var(--surface);font-weight:600}

.sum{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:20px;max-width:520px}
.sum b{font:800 20px/1 var(--f-display);justify-self:end}
.sum .bar{grid-column:1/-1}
.okm{color:var(--accent);font-weight:600}
.topics li.lk{opacity:.75}
.topics .lkt{color:var(--muted);font-weight:500}
.demo{border:1px dashed var(--mark);background:var(--surface);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--muted);margin:0 0 20px;max-width:520px}
.form{display:grid;gap:14px;max-width:460px}
.fld{display:grid;gap:6px}
.fld label{font:500 13px/1.2 var(--f-mono);color:var(--muted);letter-spacing:.04em}
.fld input,.fld select{font:500 16px/1.3 var(--f-body);padding:13px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);width:100%;min-width:0}
.fld input.up{text-transform:uppercase;letter-spacing:.12em;font-family:var(--f-mono)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:0}
.cred{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:14px;max-width:460px}
.cred .kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.cred .kv span{font:500 13px/1 var(--f-mono);color:var(--muted);letter-spacing:.06em}
.cred .kv b{font:600 22px/1.2 var(--f-mono);overflow-wrap:anywhere}
.me-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}
.me-card h2{font-size:clamp(22px,4vw,30px)}
.me-card p{margin:4px 0 0;color:var(--muted);font-size:14px}
.ptabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:8px 0 22px;overflow-x:auto}
.ptab{padding:12px 16px;border:0;background:transparent;color:var(--muted);font:600 15px/1 var(--f-body);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.ptab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--ict)}
.frow{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}
.frow .fld{min-width:110px;flex:1 1 130px}
.twx{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font:500 12px/1 var(--f-mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .mono{font-family:var(--f-mono)}
.chipst{font:400 12px/1 var(--f-mono);padding:4px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chipst.on{color:var(--accent);border-color:var(--accent)}
.codes-new{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:18px;font:500 15px/1.8 var(--f-mono);display:flex;flex-wrap:wrap;gap:6px 18px}
.btn.xs{padding:7px 10px;font-size:13px;border-width:1.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw}
footer{border-top:1px solid var(--line);padding-block:28px 36px;color:var(--muted);font-size:14px;margin-top:24px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}

@media (max-width:760px){
  .divs,.two{grid-template-columns:1fr}
  .hero{padding-block:32px 24px}
  .sel{grid-template-columns:1fr}
  .nav .wrap{flex-direction:column;align-items:flex-start;gap:6px;padding:10px 0 6px}
  .nav ul{width:100%}
  section{padding-block:24px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn:hover{transform:none}}

/* === Full-width + polish === */
html{zoom:var(--z,1);min-height:100%}
body{padding-left:max(clamp(14px,3vw,56px),env(safe-area-inset-left,0px));padding-right:max(clamp(14px,3vw,56px),env(safe-area-inset-right,0px));min-height:100vh;
  background:radial-gradient(1200px 500px at 85% -10%,color-mix(in srgb,var(--math) 14%,transparent),transparent 60%),radial-gradient(1000px 500px at 5% -5%,color-mix(in srgb,var(--ict) 14%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
.wrap{max-width:none;width:100%}
.lesson{max-width:84ch}.q,.game{max-width:760px}
header.nav{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.zoom{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.zoom button{border:0;background:transparent;color:var(--fg);font:700 15px/1 var(--f-mono);min-width:34px;height:32px;border-radius:999px;cursor:pointer}
.zoom button:hover{background:var(--bg)}
.zoom .zv{font:500 12px/1 var(--f-mono);color:var(--muted);min-width:42px;text-align:center;cursor:pointer;border:0;background:transparent}
.panel,.card,.hub,.topics li,.q,.game{box-shadow:0 1px 2px rgba(18,33,43,.05),0 8px 24px -12px rgba(18,33,43,.18)}
.panel{border-radius:20px;transition:transform .2s,box-shadow .2s}
.panel:hover{transform:translateY(-3px);box-shadow:0 14px 34px -14px color-mix(in srgb,var(--accent) 45%,transparent)}
.hub{border-radius:26px}
.tile{background:color-mix(in srgb,var(--accent) 7%,var(--surface));border:1px solid var(--line);transition:transform .18s,border-color .18s,box-shadow .18s}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 26px -14px color-mix(in srgb,var(--accent) 55%,transparent)}
.tile svg{width:34px;height:34px;padding:7px;box-sizing:content-box;background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:12px}
.tiles{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.topics{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.topics li{border-radius:14px;transition:transform .15s,border-color .15s}

            {t:"Ikki xonali sonni 11 ga ko‘paytirish",b:"<p>Sonning raqamlari orasiga ularning yig‘indisini qo‘ying.</p><p><b>Misol:</b> 35 × 11 = 3 (3+5) 5 = 385.</p><p>Yig‘indi 10 dan oshsa, birlikni chap raqamga qo‘shing: 78 × 11 = 7 (15) 8 = 858.</p>"},
            {t:"5 bilan tugaydigan sonning kvadrati",b:"<p>Birlar xonasidan oldingi qismni keyingi son bilan ko‘paytiring va oxiriga 25 yozing.</p><p><b>Misol:</b> 35² uchun 3 × 4 = 12, natija 1225.</p>"},
            {t:"25 ga ko‘paytirish",b:"<p>Sonni 100 ga ko‘paytirib, 4 ga bo‘ling.</p><p><b>Misol:</b> 36 × 25 = 3600 : 4 = 900.</p>"},
            {t:"9 ga ko‘paytirish",b:"<p>Sonni 10 ga ko‘paytirib, o‘zini ayiring.</p><p><b>Misol:</b> 7 × 9 = 70 − 7 = 63.</p>"},
            {t:"Foizni tez topish",b:"<p>Avval 10 foizni toping, keyin kerakli qismlarga bo‘ling.</p><p><b>Misol:</b> 80 ning 15 foizi: 10% = 8, 5% = 4, jami 12.</p>"}
          ]},
        {id:"formulalar",t:"Formulalar",i:"sigma",k:"acc",d:"Algebra va geometriya",
          intro:"Eng ko‘p kerak bo‘ladigan formulalar bir joyda.",
          items:[
            {t:"Qisqa ko‘paytirish formulalari",b:"<ul><li>(a + b)² = a² + 2ab + b²</li><li>(a − b)² = a² − 2ab + b²</li><li>a² − b² = (a − b)(a + b)</li></ul>"},
            {t:"Yuza va perimetr",b:"<ul><li>To‘g‘ri to‘rtburchak: S = a·b, P = 2(a + b)</li><li>Kvadrat: S = a², P = 4a</li><li>Uchburchak: S = ½·a·h</li><li>Trapesiya: S = ½(a + b)·h</li><li>Doira: S = πr², aylana uzunligi C = 2πr</li></ul>"},
            {t:"Kvadrat tenglama",b:"<p>ax² + bx + c = 0 uchun diskriminant D = b² − 4ac.</p><ul><li>D &gt; 0: ikkita ildiz, x = (−b ± √D) / 2a</li><li>D = 0: bitta ildiz, x = −b / 2a</li><li>D &lt; 0: haqiqiy ildiz yo‘q</li></ul>"},
            {t:"Progressiyalar",b:"<ul><li>Arifmetik: aₙ = a₁ + (n − 1)d, Sₙ = (a₁ + aₙ)·n / 2</li><li>Geometrik: bₙ = b₁·qⁿ⁻¹</li></ul>"},
            {t:"Pifagor teoremasi va trigonometriya",b:"<ul><li>To‘g‘ri burchakli uchburchakda c² = a² + b²</li><li>sin²α + cos²α = 1</li></ul>"}
          ]},

  function makeSlides(d,g,c){

  function guide(d,g,p){

    for(var i=0;i<n;i++)if(passed(d,g,i))done++;
    if(isStu())h+='<div class="sum"><span class="lbl" style="margin:0">Bajarildi</span><b>'+done+' / '+n+'</b><div class="bar"><i style="width:'+(n?done/n*100:0)+'%"></i></div></div>';
    h+='<p class="lbl">'+g+'-sinf · '+d.fan.toLowerCase()+' mavzulari</p><ul class="topics">';
    var ready=0;
    d.topics[g].forEach(function(t,i){
      var st=stateOf(d,g,i);
      if(st==="soon")h+='<li>'+t+'<span class="tag">tez orada</span></li>';
      else if(st==="locked")h+='<li class="lk"><span class="lkt">'+t+'</span><span class="tag">qulflangan: oldingi mavzuni 100% bajaring</span></li>';
      else{ready++;h+='<li><button type="button" class="tl" data-i="'+i+'">'+t+'</button><span class="tag ok">'+(st==="done"?"bajarildi":(isStu()?"ochiq":"dars va test"))+'</span></li>'}
    });
    p.innerHTML=h+'</ul><p class="note">'+(ready?'Mavzuni bosib, darsni oching.':'Bu sinf uchun darslar tayyorlanmoqda.')+'</p>';
    $$(".tl",p).forEach(function(b){b.addEventListener("click",function(){var i=+b.dataset.i;lesson(d,g,i,findTopic(d,g,d.topics[g][i]),p)})});

  function lesson(d,g,i,c,p){

    if(isStu()&&!(pr()[tkey(d,g,i)]||{}).read)saveProg(d,g,i,{read:true});
    p.innerHTML='<button class="btn sm" type="button" id="bk">← Mavzular</button>'+
      '<div class="lesson"><p class="lbl">'+g+'-sinf · '+d.fan.toLowerCase()+' darsi</p><h3 class="lt">'+c.t+'</h3>'+fr(c.lesson)+
      '<div class="row" style="margin-top:24px"><button class="btn primary" type="button" id="tt">Mavzu testini boshlash ('+c.quiz.length+' savol)</button></div></div>';
    $("#bk",p).addEventListener("click",function(){guide(d,g,p)});
    $("#tt",p).addEventListener("click",function(){topicTest(d,g,i,c,p,function(){guide(d,g,p)})});
    window.scrollTo(0,0);

  function topicTest(d,g,i,c,p,back){
    runQuiz(shuffle(c.quiz),g+'-sinf · '+c.t,p,back,"Mavzular ro‘yxati",function(score,total){
      if(!isStu())return "";
      var prev=pr()[tkey(d,g,i)]||{},ok=score>=total*PASS;
      saveProg(d,g,i,{read:true,best:Math.max(prev.best||0,score),total:total,tries:(prev.tries||0)+1,passed:!!(prev.passed||ok)});
      if(ok){var nxt=i+1<d.topics[g].length&&findTopic(d,g,d.topics[g][i+1]);return '<p class="sub okm">Mavzu 100% bajarildi.'+(nxt?' Keyingi mavzu ochildi.':'')+'</p>'}
      return '<p class="sub">Keyingi mavzuga o‘tish uchun barcha savollarga to‘g‘ri javob bering. Darsni qayta o‘qib, yana urinib ko‘ring.</p>';
    });
  }

  function runQuiz(qs,label,p,onBack,backText,onFinish){
    var i=0,score=0,done=false;
    function render(){
      if(i>=qs.length){
        var extra=onFinish?onFinish(score,qs.length):"";
        p.innerHTML='<div class="q"><p class="lbl">Natija · '+esc(label)+'</p><div class="big-score">'+score+' / '+qs.length+'</div>'+
          '<p class="sub" style="margin-bottom:12px">'+(score===qs.length?"Ajoyib natija!":score>=qs.length/2?"Yaxshi, yana mashq qiling.":"Mavzuni takrorlab, qayta urinib ko‘ring.")+'</p>'+extra+
          '<div class="row" style="margin-top:12px"><button class="btn primary sm" id="again" type="button">Qayta boshlash</button><button class="btn sm" id="back" type="button">'+(backText||"Orqaga")+'</button></div></div>';
        $("#again",p).addEventListener("click",function(){runQuiz(shuffle(qs),label,p,onBack,backText,onFinish)});
        $("#back",p).addEventListener("click",onBack);return;
      }
      var c=qs[i];done=false;
      var h='<div class="q"><p class="lbl">'+esc(label)+' · savol '+(i+1)+' / '+qs.length+'</p><p class="qt">'+efr(c.q)+'</p><div class="opts">';
      c.o.forEach(function(t,k){h+='<button class="opt" type="button" data-k="'+k+'">'+efr(t)+'</button>'});
      p.innerHTML=h+'</div><p class="fb" aria-live="polite"></p><button class="btn primary sm" id="nx" type="button" hidden>Keyingi</button></div>';
      $$(".opt",p).forEach(function(x){x.addEventListener("click",function(){
        if(done)return;done=true;var k=+x.dataset.k;
        $$(".opt",p)[c.a].classList.add("ok");
        if(k!==c.a)x.classList.add("no");else score++;
        $(".fb",p).innerHTML=efr((k===c.a?"To‘g‘ri. ":"Noto‘g‘ri. ")+c.e);
        var nx=$("#nx",p);nx.textContent=i===qs.length-1?"Natijani ko‘rish":"Keyingi";nx.hidden=false;
      })});
      $("#nx",p).addEventListener("click",function(){i++;render()});
    }
    render();
  }

  function quiz(d,g,p){
    var pool=d.quiz.filter(function(q){return g>=q.g[0]&&g<=q.g[1]});
    if(pool.length<3)pool=d.quiz.filter(function(q){return Math.abs(g-(q.g[0]+q.g[1])/2)<=3});
    d.topics[g].forEach(function(t,i){var c=findTopic(d,g,t);if(c&&(!isStu()||passed(d,g,i)))pool=pool.concat(c.quiz)});
    function menu(){
      var h='<p class="lbl">'+g+'-sinf · test turini tanlang</p><ul class="topics">'+
        '<li><button type="button" class="tl" id="mix">Aralash test</button><span class="tag">'+Math.min(10,pool.length)+' savol</span></li>';
      d.topics[g].forEach(function(t,i){
        var st=stateOf(d,g,i),c=findTopic(d,g,t);
        if(st==="soon")h+='<li>'+t+'<span class="tag">tez orada</span></li>';
        else if(st==="locked")h+='<li class="lk"><span class="lkt">'+t+'</span><span class="tag">qulflangan: oldingi mavzuni 100% bajaring</span></li>';
        else h+='<li><button type="button" class="tl" data-i="'+i+'">'+t+'</button><span class="tag ok">'+(st==="done"?"bajarildi · ":"")+c.quiz.length+' savol</span></li>';
      });
      p.innerHTML=h+'</ul>'+(isStu()?'<p class="note">Aralash testga faqat bajarilgan mavzular savollari qo‘shiladi.</p>':'');
      $("#mix",p).addEventListener("click",function(){
        runQuiz(shuffle(pool).slice(0,10),g+'-sinf · aralash test',p,menu,"Testlar ro‘yxati");
      });
      $$("[data-i]",p).forEach(function(b){b.addEventListener("click",function(){
        var i=+b.dataset.i;topicTest(d,g,i,findTopic(d,g,d.topics[g][i]),p,menu);
      })});
    }
    menu();
  }

  function binaryGame(el,grade){
    var max=grade<=5?15:grade<=8?63:255,target,bits,score=0;
    function newRound(){target=rnd(1,max);bits=[0,0,0,0,0,0,0,0];draw()}
    function val(){var s=0;for(var i=0;i<8;i++)s+=bits[i]*(128>>i);return s}
    function draw(){
      var h='<div class="stat"><span>Ball: <b>'+score+'</b></span><span>Hozir: <b id="cur">'+val()+'</b></span></div>'+
        '<div class="target" aria-label="Berilgan son">'+target+'</div><div class="bits">';
      for(var i=0;i<8;i++)h+='<div class="bit"><button type="button" data-i="'+i+'" aria-pressed="'+(bits[i]?"true":"false")+'" aria-label="'+(128>>i)+' o‘rni">'+bits[i]+'</button><span>'+(128>>i)+'</span></div>';
      h+='</div><p class="fb" id="gfb" aria-live="polite">Bitlarning yig‘indisi berilgan songa teng bo‘lsin.</p><div class="row"><button class="btn sm" id="skip" type="button">Boshqa son</button></div>';
      el.innerHTML=h;
      $$("[data-i]",el).forEach(function(x){x.addEventListener("click",function(){
        var i=+x.dataset.i;bits[i]=bits[i]?0:1;
        x.textContent=bits[i];x.setAttribute("aria-pressed",String(!!bits[i]));
        $("#cur",el).textContent=val();
        if(val()===target){score++;$("#gfb",el).textContent="To‘g‘ri! "+target+" = "+bits.join("");setTimeout(newRound,900)}
      })});
      $("#skip",el).addEventListener("click",newRound);
    }
    newRound();
  }

  function mathGame(el,grade){
    var key="ustozbek-best-"+grade,best=+store(key)||0,score=0,left=30,cur=null;
    function make(){
      var a,b,c,q,ans;
      if(grade<=2){a=rnd(1,grade===1?10:50);b=rnd(1,grade===1?10:30);if(Math.random()<.5||a<b){q=a+" + "+b;ans=a+b}else{q=a+" − "+b;ans=a-b}}
      else if(grade<=4){if(Math.random()<.6){a=rnd(2,9);b=rnd(2,9);q=a+" × "+b;ans=a*b}else{a=rnd(10,99);b=rnd(10,99);q=a+" + "+b;ans=a+b}}
      else if(grade<=8){if(Math.random()<.5){a=rnd(6,15);b=rnd(6,15);q=a+" × "+b;ans=a*b}else{a=rnd(3,12);b=rnd(3,12);c=rnd(1,30);q=a+" × "+b+" + "+c;ans=a*b+c}}
      else{if(Math.random()<.5){a=rnd(11,25);q=a+"²";ans=a*a}else{a=rnd(3,15);b=rnd(3,15);c=rnd(2,9);var e=rnd(2,9);q=a+" × "+b+" − "+c+" × "+e;ans=a*b-c*e}}
      return {q:q,a:ans};
    }
    function intro(){
      el.innerHTML='<div class="stat"><span>Eng yaxshi natija ('+grade+'-sinf): <b>'+best+'</b></span></div><div class="row"><button class="btn primary" id="go" type="button">Boshlash</button></div>';
      $("#go",el).addEventListener("click",start);
    }
    function start(){
      score=0;left=30;
      el.innerHTML='<div class="stat"><span>Ball: <b id="sc">0</b></span><span>Vaqt: <b id="tm">30</b> s</span></div><div class="bar"><i id="pb" style="width:100%"></i></div>'+
        '<div class="mq" id="mq"></div><input class="inp" id="in" inputmode="numeric" autocomplete="off" aria-label="Javob"><p class="fb" id="gfb" aria-live="polite">Javobni yozib Enter bosing.</p>';
      var inp=$("#in",el);
      function nextQ(){cur=make();$("#mq",el).textContent=cur.q+" = ?";inp.value="";}
      nextQ();inp.focus();
      inp.addEventListener("keydown",function(ev){
        if(ev.key!=="Enter")return;
        var v=parseInt(inp.value,10);
        if(v===cur.a){score++;$("#sc",el).textContent=score;$("#gfb",el).textContent="To‘g‘ri!"}
        else $("#gfb",el).textContent="Noto‘g‘ri edi: "+cur.q+" = "+cur.a;
        nextQ();
      });
      stopTimer();
      timer=setInterval(function(){
        left--;$("#tm",el).textContent=left;$("#pb",el).style.width=(left/30*100)+"%";
        if(left<=0){stopTimer();finish()}
      },1000);
    }
    function finish(){
      var rec=score>best;if(rec){best=score;store(key,String(best))}
      el.innerHTML='<p class="lbl">Vaqt tugadi</p><div class="big-score">'+score+'</div><p class="sub">'+(rec?"Yangi rekord!":"Eng yaxshi natija: "+best)+'</p><div class="row"><button class="btn primary" id="go" type="button">Yana o‘ynash</button></div>';
      $("#go",el).addEventListener("click",start);
    }
    intro();
  }

      ev.preventDefault();var er=$("#er"),sb=$("#sb");er.textContent="";sb.disabled=true;sb.textContent="Tekshirilmoqda…";
      registering=true;
      UB.register({ism:$("#ism").value,familiya:$("#fam").value,maktab:$("#mk").value,sinf:$("#sn").value,code:$("#kd").value})
        .then(function(r){registering=false;credHtml={login:r.login,password:r.password};showCreds()})
        .catch(function(e){registering=false;er.textContent=e.message||"Ro‘yxatdan o‘tib bo‘lmadi";sb.disabled=false;sb.textContent="Ro‘yxatdan o‘tish"});
    });
  }
  function showCreds(){
    var c=credHtml;
    app.innerHTML='<div class="page"><p class="eyebrow" style="color:var(--ict)">Ro‘yxatdan o‘tdingiz</p><h2 style="margin-bottom:20px">Hisobingiz tayyor</h2>'+
      '<div class="cred"><div class="kv"><span>LOGIN</span><b>'+esc(c.login)+'</b></div><div class="kv"><span>PAROL</span><b>'+esc(c.password)+'</b></div>'+
      '<p class="sub" style="margin:0">Login va parolni hozir saqlab oling: nusxa oling yoki ekranni rasmga tushiring. Parolni keyinroq ko‘rib bo‘lmaydi.</p>'+
      '<div class="row"><button class="btn sm" type="button" id="cc">Nusxa olish</button><button class="btn primary sm" type="button" id="gk">Kabinetga o‘tish</button></div></div></div>';
    $("#cc").addEventListener("click",function(){copyText("Ustozbek\nLogin: "+c.login+"\nParol: "+c.password)});
    $("#gk").addEventListener("click",function(){credHtml=null;go("#kabinet")});
  }

  function cabinet(){
    if(!me){afterLogin="kabinet";go("#kirish");return}
    if(me.role==="teacher"){go("#panel");return}
    app.removeAttribute("data-div");
    var pf=me.profile,g=pf.grade;
    function card(d){
      var n=d.topics[g].length,done=doneCount(d,g,pr()),ready=topicData(d,g).length;
      return '<div class="panel" data-div="'+d.key+'"><span class="big">'+d.name+'</span>'+
        '<p>'+g+'-sinf · '+done+' / '+n+' mavzu bajarildi'+(ready?'':' (darslar tayyorlanmoqda)')+'</p>'+
        '<div class="bar"><i style="width:'+(n?done/n*100:0)+'%"></i></div>'+
        '<div class="row"><a class="btn primary sm" href="#'+d.path+'-oquvchi-darslar">Darslarni davom ettirish</a><a class="btn sm" href="#'+d.path+'-oquvchi">Barcha bo‘limlar</a></div></div>';
    }
    app.innerHTML='<div class="page"><div class="me-card"><div><h2>'+esc(pf.ism)+' '+esc(pf.familiya)+'</h2><p>'+esc(pf.maktab)+' · '+g+'-sinf · login: <b>'+esc(pf.login)+'</b></p></div><button class="btn sm" type="button" id="lo">Chiqish</button></div>'+
      '<div class="divs">'+card(D.ict)+card(D.math)+'</div>'+
      '<p class="note">Keyingi mavzu oldingi mavzuning dars va testi 100% bajarilgach ochiladi.</p></div>';
    $("#lo").addEventListener("click",function(){UB.logout().then(function(){go("#home")})});
  }

  var PS={tab:"codes",cg:"all",cs:"all",sg:"all",sq:""};
  function panel(){
    app.removeAttribute("data-div");
    if(me&&me.role==="student"){go("#kabinet");return}
    if(!me){
      app.innerHTML='<div class="page"><p class="eyebrow" style="color:var(--ict)">O‘qituvchi</p><h2 style="margin-bottom:12px">O‘qituvchi paneli</h2>'+demoBanner()+
        '<p class="sub" style="margin-bottom:20px">Kodlar yaratish va o‘quvchilar natijalarini ko‘rish uchun '+(UB.mode==="demo"?'demo rejimda kiring.':'Google hisobingiz bilan kiring.')+'</p>'+
        '<button class="btn primary" type="button" id="tl">'+(UB.mode==="demo"?"Demo kirish":"Google bilan kirish")+'</button><p class="err" id="er" role="alert" style="margin-top:12px"></p>'+
        '<p class="note">Telegram ichidagi oynada Google orqali kirish ishlamasligi mumkin. Brauzerda oching.</p></div>';
      $("#tl").addEventListener("click",function(){
        var er=$("#er");er.textContent="";
        UB.teacherLogin().catch(function(e){er.textContent=e.message||"Kirib bo‘lmadi"});
      });
      return;
    }
    app.innerHTML='<div class="page"><div class="me-card"><div><h2>O‘qituvchi paneli</h2><p>'+esc(me.name||"")+'</p></div><button class="btn sm" type="button" id="lo">Chiqish</button></div>'+demoBanner()+
      '<div class="ptabs" role="tablist"><button class="ptab" role="tab" data-t="codes">Kodlar</button><button class="ptab" role="tab" data-t="students">O‘quvchilar</button></div><div id="pb"></div></div>';
    $("#lo").addEventListener("click",function(){UB.logout().then(function(){go("#home")})});
    $$(".ptab").forEach(function(b){b.addEventListener("click",function(){PS.tab=b.dataset.t;drawTab()})});
    function drawTab(){
      $$(".ptab").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.t===PS.tab))});
      if(PS.tab==="codes")codesTab($("#pb"));else studentsTab($("#pb"));
    }
    drawTab();
  }

  function codesTab(b){
    b.innerHTML='<div class="frow"><div class="fld"><label for="cg">SINF</label><select id="cg">'+gradeOpts(5)+'</select></div>'+
      '<div class="fld"><label for="cn">SONI</label><input id="cn" type="number" min="1" max="50" value="10" inputmode="numeric"></div>'+
      '<div class="fld"><label for="cm">IZOH (IXTIYORIY)</label><input id="cm" maxlength="80" placeholder="Masalan, 5-A sinf"></div>'+
      '<button class="btn primary sm" type="button" id="mk">Kodlar yaratish</button></div>'+
      '<p class="err" id="er" role="alert"></p><div id="newc"></div>'+
      '<div class="frow"><div class="fld"><label for="fg">SINF BO‘YICHA</label><select id="fg"><option value="all">Hammasi</option>'+gradeOpts(0)+'</select></div>'+
      '<div class="fld"><label for="fs">HOLATI</label><select id="fs"><option value="all">Hammasi</option><option value="free">Bo‘sh</option><option value="used">Ishlatilgan</option></select></div>'+
      '<button class="btn sm" type="button" id="cf">Bo‘shlarini nusxalash</button></div><div id="cl"><p class="sub">Yuklanmoqda…</p></div>';
    $("#fg").value=PS.cg;$("#fs").value=PS.cs;
    var codes=[],names={};
    function load(){
      Promise.all([UB.listCodes(),UB.listStudents().catch(function(){return []})]).then(function(r){
        codes=r[0];names={};r[1].forEach(function(x){names[x.uid]=x.ism+" "+x.familiya});draw();
      }).catch(function(){$("#cl").innerHTML='<p class="err">Kodlarni yuklab bo‘lmadi.</p>'});
    }
    function filtered(){return codes.filter(function(c){return (PS.cg==="all"||+PS.cg===+c.grade)&&(PS.cs==="all"||(PS.cs==="free"?!c.used:c.used))})}
    function draw(){
      var l=filtered();
      if(!l.length){$("#cl").innerHTML='<p class="sub">Kod topilmadi. Yuqorida yangi kodlar yarating.</p>';return}
      var h='<div class="twx"><table class="tbl"><tr><th>Kod</th><th>Sinf</th><th>Holati</th><th>Izoh</th><th></th></tr>';
      l.forEach(function(c){
        h+='<tr><td class="mono"><b>'+esc(c.code)+'</b></td><td>'+c.grade+'</td><td>'+(c.used?'<span class="chipst on">'+esc(names[c.usedBy]||"ishlatilgan")+'</span>':'<span class="chipst">bo‘sh</span>')+'</td><td>'+esc(c.note)+'</td><td>'+(c.used?'':'<button class="btn xs" type="button" data-del="'+esc(c.code)+'">O‘chirish</button>')+'</td></tr>';
      });
      $("#cl").innerHTML=h+'</table></div>';
      $$("[data-del]",b).forEach(function(x){x.addEventListener("click",function(){
        UB.deleteCode(x.dataset.del).then(function(){codes=codes.filter(function(c){return c.code!==x.dataset.del});draw()}).catch(function(){toast("O‘chirib bo‘lmadi")});
      })});
    }
    $("#fg").addEventListener("change",function(){PS.cg=this.value;draw()});
    $("#fs").addEventListener("change",function(){PS.cs=this.value;draw()});
    $("#cf").addEventListener("click",function(){
      var l=filtered().filter(function(c){return !c.used});
      if(!l.length){toast("Bo‘sh kod yo‘q");return}
      copyText(l.map(function(c){return c.code+" ("+c.grade+"-sinf"+(c.note?", "+c.note:"")+")"}).join("\n"));
    });
    $("#mk").addEventListener("click",function(){
      var er=$("#er"),btn=this;er.textContent="";btn.disabled=true;
      UB.createCodes($("#cg").value,$("#cn").value,$("#cm").value).then(function(list){
        btn.disabled=false;
        $("#newc").innerHTML='<p class="lbl">Yangi kodlar · '+$("#cg").value+'-sinf</p><div class="codes-new">'+list.map(function(c){return '<span>'+esc(c)+'</span>'}).join("")+'</div><button class="btn sm" type="button" id="cp" style="margin-bottom:20px">Hammasini nusxalash</button>';
        $("#cp").addEventListener("click",function(){copyText(list.join("\n"))});
        load();
      }).catch(function(e){btn.disabled=false;er.textContent=e.message||"Kodlarni yaratib bo‘lmadi"});
    });
    load();
  }

  function studentsTab(b){
    b.innerHTML='<div class="frow"><div class="fld"><label for="sg">SINF</label><select id="sg"><option value="all">Hammasi</option>'+gradeOpts(0)+'</select></div>'+
      '<div class="fld"><label for="sq">QIDIRISH</label><input id="sq" placeholder="Ism, familiya yoki maktab"></div>'+
      '<button class="btn sm" type="button" id="cx">Jadvalni nusxalash</button></div><div id="sl"><p class="sub">Yuklanmoqda…</p></div>';
    $("#sg").value=PS.sg;$("#sq").value=PS.sq;
    var list=[];
    function rows(){
      var q=PS.sq.trim().toLowerCase();
      return list.filter(function(x){return (PS.sg==="all"||+PS.sg===+x.grade)&&(!q||(x.ism+" "+x.familiya+" "+x.maktab).toLowerCase().indexOf(q)>=0)})
        .sort(function(a,b2){return a.grade-b2.grade||String(a.familiya).localeCompare(String(b2.familiya))});
    }
    function pText(d,x){return doneCount(d,x.grade,x.progress)+" / "+d.topics[x.grade].length}
    function draw(){
      var l=rows();
      if(!l.length){$("#sl").innerHTML='<p class="sub">'+(list.length?"Mos o‘quvchi topilmadi.":"Hali o‘quvchilar ro‘yxatdan o‘tmagan.")+'</p>';return}
      var h='<p class="lbl">'+l.length+' ta o‘quvchi</p><div class="twx"><table class="tbl"><tr><th>O‘quvchi</th><th>Maktab</th><th>Sinf</th><th>Login</th><th>ICTBEK</th><th>MATHBEK</th><th>Oxirgi faollik</th></tr>';
      l.forEach(function(x){
        h+='<tr><td>'+esc(x.ism)+' '+esc(x.familiya)+'</td><td>'+esc(x.maktab)+'</td><td>'+x.grade+'</td><td class="mono">'+esc(x.login)+'</td><td>'+pText(D.ict,x)+'</td><td>'+pText(D.math,x)+'</td><td>'+fmt(x.lastSeen)+'</td></tr>';
      });
      $("#sl").innerHTML=h+'</table></div>';unlockUI();
    }
    function unlockUI(){
      var l=rows();
      var h='<div class="unl"><p class="lbl">Mavzuni ochib berish</p><p class="sub" style="margin-bottom:10px">Savolda xato topilsa yoki o‘quvchi qotib qolsa, mavzuni "bajarildi" deb belgilang. Keyingi mavzu ochiladi.</p><div class="frow"><div class="fld"><label for="us">O‘QUVCHI</label><select id="us">'+
        l.map(function(x,i){return'<option value="'+i+'">'+esc(x.ism+" "+x.familiya)+' ('+x.grade+'-sinf)</option>'}).join("")+'</select></div>'+
        '<div class="fld"><label for="ud">FAN</label><select id="ud"><option value="ict">ICTBEK</option><option value="math">MATHBEK</option></select></div>'+
        '<div class="fld"><label for="ut">MAVZU</label><select id="ut"></select></div><button class="btn primary sm" type="button" id="uk">Ochib berish</button></div><p class="sub" id="um"></p></div>';
      $("#sl").insertAdjacentHTML("beforeend",h);
      function fill(){
        var x=l[+$("#us").value],d=D[$("#ud").value],o="";
        if(x)d.topics[x.grade].forEach(function(t,i){if(findTopic(d,x.grade,t))o+='<option value="'+i+'">'+esc(t)+(passedK(x.progress||{},d,x.grade,i)?" ✓":"")+'</option>'});
        $("#ut").innerHTML=o||'<option value="">Bu sinfda mavzu yo‘q</option>';
      }
      $("#us").addEventListener("change",fill);$("#ud").addEventListener("change",fill);fill();
      $("#uk").addEventListener("click",function(){
        var x=l[+$("#us").value],d=D[$("#ud").value],i=$("#ut").value;
        if(!x||i==="")return;var key=tkey(d,x.grade,+i);
        UB.unlockTopic(x.uid,key).then(function(){
          (x.progress||(x.progress={}))[key]={read:true,passed:true,byTeacher:true};
          $("#um").textContent=x.ism+" "+x.familiya+": mavzu ochildi.";fill();
        }).catch(function(){$("#um").textContent="Ochib bo‘lmadi. Internet yoki ruxsatni (Firestore qoidalarini) tekshiring."});
      });
    }
    $("#sg").addEventListener("change",function(){PS.sg=this.value;draw()});
    $("#sq").addEventListener("input",function(){PS.sq=this.value;draw()});
    $("#cx").addEventListener("click",function(){
      var l=rows();if(!l.length){toast("Nusxalash uchun ma’lumot yo‘q");return}
      copyText(["Ism\tFamiliya\tMaktab\tSinf\tLogin\tICTBEK\tMATHBEK"].concat(l.map(function(x){return [x.ism,x.familiya,x.maktab,x.grade,x.login,pText(D.ict,x),pText(D.math,x)].join("\t")})).join("\n"));
    });
    UB.listStudents().then(function(r){list=r;draw()}).catch(function(){$("#sl").innerHTML='<p class="err">O‘quvchilarni yuklab bo‘lmadi.</p>'});
  }

  /* ---------- Router ---------- */
  function route(){
    stopTimer();
    var h=(location.hash||"#home").slice(1),
        m=h.match(/^(ict|math)bek(?:-(oquvchi|oqituvchi)(?:-([a-z]+))?)?$/),cur="home";
    var isAuthPage=/^(kirish|royxat|kabinet|panel)$/.test(h);
    if(h!=="royxat")credHtml=null;
    if(((m&&m[2]==="oquvchi")||isAuthPage)&&!authReady){
      app.removeAttribute("data-div");app.innerHTML='<div class="page"><p class="sub">Yuklanmoqda…</p></div>';return;
    }
    if(m&&m[2]==="oquvchi"&&!me){afterLogin=h;go("#kirish");return}
    if(isAuthPage){
      cur="acct";
      if(h==="kirish")loginPage();else if(h==="royxat")registerPage();else if(h==="kabinet")cabinet();else panel();
    }else if(m){
      var d=D[m[1]];cur=m[1];
      if(!m[2])division(d);
      else if(!m[3])hub(d,m[2]);
      else{
        var list=m[2]==="oquvchi"?d.stu:d.tea,sec=null;
        list.forEach(function(s){if(s.id===m[3])sec=s});
        if(sec)sectionPage(d,m[2],sec);else hub(d,m[2]);
      }
    }else home();
    $$("[data-nav]",document).forEach(function(a){a.classList.toggle("on",a.dataset.nav===cur);
      if(a.dataset.nav===cur)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
    window.scrollTo(0,0);
  }
  window.addEventListener("hashchange",route);
  UB.onAuth(function(u){me=u;authReady=true;updateAcct();route()});
  route();
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
<script>
(function(){
  var z=1,K='ub_zoom';
  try{var s=parseFloat(localStorage.getItem(K));if(s>=.7&&s<=1.8)z=s}catch(e){}
  function ap(){document.documentElement.style.setProperty('--z',z);var v=document.getElementById('zv');if(v)v.textContent=Math.round(z*100)+'%';try{localStorage.setItem(K,z)}catch(e){}}
  function set(n){z=Math.min(1.8,Math.max(.7,Math.round(n*10)/10));ap()}
  document.getElementById('zm').onclick=function(){set(z-.1)};
  document.getElementById('zp').onclick=function(){set(z+.1)};
  document.getElementById('zv').onclick=function(){set(1)};
  ap();
  try{var t=window.Telegram&&Telegram.WebApp;if(t){t.ready();t.expand();if(t.disableVerticalSwipes)t.disableVerticalSwipes()}}catch(e){}
})();
</script>
